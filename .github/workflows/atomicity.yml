name: Atomicity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  atomicity:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install
        run: npm install --omit=dev --no-audit --no-fund
      - name: Atomicity regression
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: node tests/atomicity.test.mjs
